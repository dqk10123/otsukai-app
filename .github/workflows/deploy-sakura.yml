name: Deploy to Sakura

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy files
        run: |
          mkdir -p dist
          cp index.html dist/
          cp manifest.webmanifest dist/
          cp service-worker.js dist/
          cp icon-192.png dist/
          cp icon-512.png dist/
          if [ -f README.txt ]; then cp README.txt dist/; fi

      - name: Install SSH tools
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync

      - name: Test SSH connection
        env:
          SSH_HOST: ${{ secrets.SAKURA_FTP_HOST }}
          SSH_USER: ${{ secrets.SAKURA_FTP_USER }}
          SSH_PASSWORD: ${{ secrets.SAKURA_FTP_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh             -o StrictHostKeyChecking=accept-new             -o ConnectTimeout=20             -o ServerAliveInterval=10             -o ServerAliveCountMax=2             "$SSH_USER@$SSH_HOST" "pwd"

      - name: Deploy to Sakura via SFTP/SSH
        env:
          SSH_HOST: ${{ secrets.SAKURA_FTP_HOST }}
          SSH_USER: ${{ secrets.SAKURA_FTP_USER }}
          SSH_PASSWORD: ${{ secrets.SAKURA_FTP_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" rsync -av --delete             -e "ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=2"             ./dist/ "$SSH_USER@$SSH_HOST:/home/$SSH_USER/www/apps/parent/otsukai/"
