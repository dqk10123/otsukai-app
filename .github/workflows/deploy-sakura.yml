name: Deploy to Sakura

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Test FTP login and list directories
        env:
          FTP_HOST: ${{ secrets.SAKURA_FTP_HOST }}
          FTP_USER: ${{ secrets.SAKURA_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SAKURA_FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST" <<'LFTP_CMDS'
          set cmd:fail-exit yes
          set net:timeout 15
          set net:max-retries 1
          set net:reconnect-interval-base 1
          set ftp:passive-mode yes
          set ftp:ssl-allow no
          pwd
          cls -la
          cd www
          pwd
          cls -la
          cd apps
          cd parent
          cd otsukai
          pwd
          cls -la
          bye
          LFTP_CMDS
