# test deploy after manual publish
name: Deploy to Sakura

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy files
        run: |
          mkdir -p dist
          cp index.html dist/
          cp manifest.webmanifest dist/
          cp service-worker.js dist/
          cp icon-192.png dist/
          cp icon-512.png dist/
          if [ -f README.txt ]; then cp README.txt dist/; fi

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy to Sakura via FTPS
        env:
          FTP_HOST: ${{ secrets.SAKURA_FTP_HOST }}
          FTP_USER: ${{ secrets.SAKURA_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.SAKURA_FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<'LFTP_CMDS'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          mirror -R --delete --verbose ./dist/ www/apps/parent/otsukai/
          bye
          LFTP_CMDS
